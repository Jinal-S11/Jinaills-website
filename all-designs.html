<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Designs — Jinaills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF4F0;
    --cream-deep:#F5E9E2;
    --rose:#C98E93;
    --rose-deep:#B87680;
    --plum:#2E2229;
    --sage:#A9B79C;
    --gold:#BF9B5E;
    --white:#FFFFFF;
    --radius-card: 22px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--plum);
    font-family:'Manrope', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em; }
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}
  .eyebrow{
    font-size:12px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--rose-deep); font-weight:600; margin-bottom:10px; display:inline-block;
  }

  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(251,244,240,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(46,34,41,0.08);
  }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
  .logo{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:22px; }
  .navlinks{ display:flex; gap:28px; list-style:none; font-size:14px; font-weight:600; }
  .navlinks a{ text-decoration:none; padding-bottom:2px; border-bottom:1px solid transparent; }
  .navlinks a:hover{ border-color:var(--rose-deep); }

  header.page-head{ padding:52px 0 36px; }
  header.page-head h1{ font-size:clamp(30px,4.6vw,44px); margin-bottom:12px; }
  header.page-head p{ max-width:52ch; color:#4a3b42; font-size:16px; }

  section{ padding:16px 0 64px; }

  .gallery-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:22px; }
  @media (max-width:820px){ .gallery-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .gallery-grid{grid-template-columns:1fr;} }

  .set-card{
    background:var(--white); border-radius:var(--radius-card);
    padding:22px 20px 20px; box-shadow:0 6px 18px rgba(46,34,41,0.06);
    display:flex; flex-direction:column;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .set-card:hover{ transform:translateY(-4px); box-shadow:0 16px 30px rgba(46,34,41,0.12); }

  .swatch-row{ display:flex; justify-content:center; align-items:flex-end; gap:8px; height:120px; margin-bottom:16px; }
  .mini-nail{
    width:34px; height:78px;
    border-radius:50% 50% 6px 6px / 60% 60% 6px 6px;
    box-shadow:0 8px 14px rgba(46,34,41,0.14);
  }
  .mini-nail.short{height:66px;}
  .mini-nail.long{height:90px;}

  .set-photo{
    width:100%;
    aspect-ratio:4/3;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:16px;
    background:var(--cream-deep);
  }
  .set-photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* design patterns */
  .p-floral{ background:radial-gradient(circle at 50% 30%, #fff 6px, transparent 7px) 6px 8px/16px 16px, radial-gradient(circle at 50% 30%,#F6D9DE 6px, transparent 7px) 0 0/16px 16px, #FCEFF1; }
  .p-ombre{ background:linear-gradient(180deg, #F7E4DC 0%, var(--rose) 100%); }
  .p-chrome{ background:linear-gradient(135deg,#EDEDED,#C9C9C9 40%,#fff 55%,#B9B9B9 80%); }
  .p-marble{ background: radial-gradient(ellipse at 20% 20%, rgba(191,155,94,0.35) 0%, transparent 40%), radial-gradient(ellipse at 70% 60%, rgba(46,34,41,0.18) 0%, transparent 35%), #F6F1EC; }
  .p-glitter{ background: radial-gradient(circle, var(--gold) 1px, transparent 1.4px) 0 0/9px 9px, radial-gradient(circle, #fff 1px, transparent 1.4px) 4px 5px/11px 11px, var(--rose); }
  .p-minimal{ background:linear-gradient(0deg, var(--plum) 0 8px, #fff 8px 100%); }
  .p-polka{ background: radial-gradient(circle, var(--cream) 5px, transparent 5.5px) 0 0/18px 18px, radial-gradient(circle, var(--cream) 5px, transparent 5.5px) 9px 9px/18px 18px, var(--rose-deep); }
  .p-french{ background: linear-gradient(0deg, #fff 0 22%, #F1D9C9 22% 100%); }
  .p-twotone{ background: linear-gradient(115deg, var(--sage) 0 48%, var(--rose) 48% 100%); }
  .p-linework{ background: repeating-linear-gradient(100deg, var(--gold) 0 2px, transparent 2px 14px), var(--cream-deep); }

  .set-card h3{font-size:18px; margin-bottom:4px;}
  .set-tag{font-size:12.5px; color:#7a6a70; margin-bottom:10px;}
  .set-foot{
    margin-top:auto; display:flex; align-items:center; justify-content:space-between;
    padding-top:14px; border-top:1px dashed rgba(46,34,41,0.14);
  }
  .price{font-family:'Fraunces',serif; font-weight:600; color:var(--gold); font-size:17px;}
  .select-btn{
    background:none; border:1px solid var(--plum); color:var(--plum);
    font-size:12.5px; font-weight:700; border-radius:999px; padding:7px 14px;
    cursor:pointer; text-decoration:none; display:inline-block;
    transition:background .15s ease, color .15s ease;
  }
  .select-btn:hover{ background:var(--plum); color:var(--cream); }

  footer{ padding:40px 0; text-align:center; border-top:1px solid rgba(46,34,41,0.08); }
  .foot-note{margin-top:10px; font-size:12px; color:#8a7a80;}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <span class="logo">Jinaills</span>
    <ul class="navlinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#order">Order</a></li>
    </ul>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <span class="eyebrow">Every design</span>
    <h1>All the sets, in one place.</h1>
    <p>New designs get added here as I make them. Tap any set to send it straight to the order form.</p>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</section>

<footer>
  <span class="logo" style="font-family:'Fraunces',serif; font-style:italic; font-size:20px;">Jinaills</span>
  <p class="foot-note">© 2026 Jinaills. Handmade to order.</p>
</footer>

<script>
  // ADD NEW DESIGNS HERE — just copy a line and edit the details.
  // photo should point to a file inside the /images folder (upload it there too).
  const sets = [
    {name:"Ocean Pearl", price:"$25", tag:"almond · mismatched pearl & wave art", photo:"images/ocean-pearl.jpeg"},
    {name:"Golden Blossom", price:"$25", tag:"almond · mismatched gold & floral", photo:"images/golden-blossom.jpeg"},
    {name:"Blue Lace French", price:"$25", tag:"almond · hand-painted blue french", photo:"images/blue-lace-french.jpeg"},
    {name:"Blueberry Branch", price:"$25", tag:"almond · sage french with berry accent", photo:"images/blueberry-branch.jpeg"},
    {name:"Cherry Red French", price:"$25", tag:"almond · red french with cherry charm", photo:"images/cherry-red-french.jpeg"}
  ];

  const grid = document.getElementById('galleryGrid');

  sets.forEach((s) => {
    const card = document.createElement('div');
    card.className = 'set-card';
    const orderUrl = `index.html?set=${encodeURIComponent(s.name + ' — ' + s.price)}#order`;
    card.innerHTML = `
      <div class="set-photo"><img src="${s.photo}" alt="${s.name} press-on nail set" loading="lazy"></div>
      <h3>${s.name}</h3>
      <p class="set-tag">${s.tag}</p>
      <div class="set-foot">
        <span class="price">${s.price}</span>
        <a class="select-btn" href="${orderUrl}">Order this →</a>
      </div>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
